name: Check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            website/package-lock.json
      - name: Show acceptance runtime
        run: |
          node -p 'JSON.stringify({node: process.versions.node, v8: process.versions.v8})'
      - run: npm ci
      - run: npm ci --prefix website
      - run: npm run check:docs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:docs
      - run: npm run build:brand
      - run: npm run check
      - run: npm run build:server-image
      - run: npm run test:server-image
      - run: docker build -f Dockerfile.railway -t machination-server:railway .
      - run: node scripts/test-railway-image.mjs
      - run: npx expo install --check
      - run: npx expo export --platform all
        env:
          CI: '1'
