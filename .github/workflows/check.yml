name: Check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  quality:
    name: Source quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check:quality
  behavior:
    name: Behavior
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test -- --suite-timeout=1800000
  server:
    name: Server packaging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: '1'
      MACHINATION_TEST_DATABASE_URL: postgres://machination:fixture-only@127.0.0.1:5432/machination_test
    services:
      postgres:
        image: postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
        env:
          POSTGRES_USER: machination
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: machination_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U machination -d machination_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: node --import tsx --test server/postgres-client.test.ts
      - run: npm run test:server-build
      - run: npm run build:server-image
      - run: npm run test:server-image
      - run: docker build -f Dockerfile.railway -t machination-server:railway .
      - run: node scripts/test-railway-image.mjs
  platforms:
    name: Platform exports
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build:brand
      - run: npx expo install --check
      - run: npx expo export --platform all
  docs:
    name: Player guide
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm ci --prefix website
      - run: npm run check:docs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:docs
  browser:
    name: Browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:smoke
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: browser-smoke-failure
          path: |
            playwright-report/
            test-results/
            .fettle/shots/
          retention-days: 7
  check:
    name: check
    if: always()
    needs: [quality, behavior, server, platforms, docs, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every independent check to pass
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: node -e 'const jobs=JSON.parse(process.env.JOB_RESULTS); if(Object.values(jobs).some(job=>job.result!=="success")) process.exit(1)'
