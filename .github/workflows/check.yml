name: Check
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:brand
      - run: npm test
      - run: npm run typecheck
      - run: npm run test:server-build
      - run: npm run build:server-image
      - run: npm run test:server-image
      - run: npx expo install --check
      - run: npx expo export --platform all
        env:
          CI: '1'
